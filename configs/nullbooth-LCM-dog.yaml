# NullBooth Configuration for LCM (Latent Consistency Model) with LCF
# 使用LCF (Latent Consistency Fine-tuning) 非蒸馏微调方法
# 基于LCM论文Algorithm 4，保持模型的快速推理能力

# Model Configuration
pretrained_model_name_or_path: "/root/bluewolf/NullBooth/LCM"  # Local Latent Consistency Model directory
model_type: "LCM"  # 指定LCM模型类型，用于正确加载调度器
revision: null
tokenizer_name: null

# LCF Mode - 启用非蒸馏微调
lcf_mode: true  # 启用Latent Consistency Fine-tuning

# Data Configuration
instance_data_dir: "/root/bluewolf/NullBooth/dataset/dog"  
class_data_dir: "/root/bluewolf/NullBooth/dataset/class_img_cache"
instance_prompt: "a photo of sks dog"  # Special token for DreamBooth-style training
class_prompt: "a photo of a dog"

# Prior Preservation - LCF不需要
with_prior_preservation: false
prior_loss_weight: 0.0
num_class_images: 0

# Validation
validation_prompt: "a photo of sks dog"
num_validation_images: 1
validation_steps: 5000  # LCF收敛快，频繁验证

# Output Configuration
output_dir: "outputs/nullbooth-lcm-model-1000dog"
seed: 42
resolution: 512
center_crop: false

# LoRA Configuration (Disabled for official DreamBooth)
use_lora: false
lora_r: null
lora_alpha: null
lora_dropout: null
lora_bias: null

# Text Encoder Training (Disabled)
train_text_encoder: false
lora_text_encoder_r: null
lora_text_encoder_alpha: null
lora_text_encoder_dropout: null
lora_text_encoder_bias: null

# Training Configuration - LCF (遵循论文推荐设置)
train_batch_size: 2  # 每个GPU处理2张图，提高吞吐
sample_batch_size: 4
num_train_epochs: null
max_train_steps: 15000  # 总样本曝光量保持不变 (原先4*30000=新8*15000)
checkpointing_steps: 1000
resume_from_checkpoint: null
gradient_accumulation_steps: 1
gradient_checkpointing: false
num_dataloader_workers: 0
no_tracemalloc: true

# Optimization - LCF推荐超参
learning_rate: 0.000008  # 8e-6 (LCM论文LCF设置)
scale_lr: false
lr_scheduler: "constant"  # 无需调度
lr_warmup_steps: 0  # 无需warmup
lr_num_cycles: 1
lr_power: 1.0
use_8bit_adam: false
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 0.0  # 无权重衰减
adam_epsilon: 0.00000001
max_grad_norm: 1.0

# LCF特定参数
lcf_parameters:
  consistency_weight: 1.0  # 一致性损失权重
  skipping_step: 20  # k=20 如论文所述
  huber_c: 0.001  # Huber损失参数
  w_min: 2.0  # 依据论文 [2,14]
  w_max: 14.0
  ema_decay: 0.9999  # 慢速EMA，贴合论文设置
  use_teacher_model: false  # LCF不需要教师模型
  use_ode_solver: false  # LCF不需要ODE求解器

# Hub Configuration
push_to_hub: false
hub_token: null
hub_model_id: null

# Logging
logging_dir: "logs"
report_to: "tensorboard"
wandb_key: null
wandb_project_name: null

# Hardware Configuration
allow_tf32: true  # Enable for RTX 4090
mixed_precision: "no"  # 关闭混合精度，LCF需要稳定性
prior_generation_precision: null
local_rank: -1
enable_xformers_memory_efficient_attention: false  # CPU运行禁用xformers
find_unused_parameters: true  # 多GPU下避免DDP未用参数报错

# NullBooth Configuration for LCM - 为LCF投影启用
nullbooth:
  enable: true
  original_knowledge_prompts: "/root/bluewolf/NullBooth/dataset/dog_prompts_1000.txt"
  cov_matrices_output_dir: "/home/public/public_nas/bluewolf/cov_matrices_LCM_1000dog"
  visual_attention_map: false  # 减少计算开销

  # LCM-specific configuration
  num_denoising_steps: 6  # 最优: 6步推理 (测试确认)
  sampler_strategy: "LCM"  # 使用LCM采样策略
  lcm_original_inference_steps: 50  # 原始教师模型步数
  timestep_mode: "all_steps"  # 使用所有步骤

  # Projection configuration - LCF极其温和
  nullspace_threshold: 0.02  # 更温和的投影阈值
  threshold_percent: 25  # 使用分位阈值选择null-space
  projection_mode: "weight_update"  # 投影权重更新
  use_interpolation: true
  debug: false
  cache_size: 50

  # Feature collection mode
  feature_collection_mode: "inference"
  inference_mode: "partial_denoise"

  # Memory Management (LCF稳定性优先)
  covariance_batch_size: 150
  feature_batch_size: 800
  gpu_memory_batch_size: 2000
  prompt_batch_size: 2
  async_io_workers: 8

  collect_features:
    q_features: true
    k_features: true
    v_features: true
    out_features: true
  cross_attention_layers: "all"

# Inference Configuration - 基于系统测试的最优配置
# 测试日期: 2024-10-12, 测试了10种不同参数组合
inference:
  prompts:
    - "A photo of sks dog"
    - "A photo of sks dog, high quality, detailed"  # Quality keywords help
    - "A portrait of sks dog, sharp focus"
    - "A photo of dog"
  negative_prompt: ""  # LCM doesn't effectively use negative prompts
  num_inference_steps: 6  # 最优: 6步 (锐度577.61) > 4步 (550.35) > 8步 (354.05)
  guidance_scale: 7.5  # 确认最优值7.5 (不是1.0也不是8.0!)
  num_images_per_prompt: 1
  height: 512
  width: 512
  generator_seed: 42
  output_dir: "inference_results/"
  compare_with_base_model: true
  # 性能指标 (6步配置):
  # - 锐度: 577.61 (越高越好)
  # - 对比度: 37.45 (最优范围: 35-40)
  # - 色彩丰富度: 38.57 (最优范围: 35-40)
